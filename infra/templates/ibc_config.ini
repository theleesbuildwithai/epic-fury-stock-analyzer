# ============================================================
# IBC Configuration — Epic Fury IBKR Mirror
# Interactive Brokers Controller config for headless IB Gateway
# Full reference: https://github.com/IbcAlpha/IBC/blob/master/userguide.md
# ============================================================

# ─── 1. IBKR LOGIN CREDENTIALS ────────────────────────────────
# ** YOU MUST FILL THESE IN BEFORE STARTING THE SERVICE **
IbLoginId=
IbPassword=

# ─── 2. TRADING MODE ──────────────────────────────────────────
# live = real money (port 4001)
# paper = simulated (port 4002)
TradingMode=live

# ─── 3. GATEWAY vs TWS ────────────────────────────────────────
# We use Gateway (lighter). Do not change.
FIX=no

# ─── 4. AUTO-RESTART ──────────────────────────────────────────
# IB Gateway auto-restarts at ~midnight ET daily to refresh session.
# IBC will handle this automatically and re-login using cached creds.
IbAutoClosedown=no
ClosedownAt=23:58
RestartAfterClosedown=yes
AutoRestartTime=00:10

# ─── 5. API SETTINGS (must match what our backend expects) ────
OverrideTwsApiPort=4001
ReadOnlyLogin=no
ReadOnlyApi=no
AcceptIncomingConnectionAction=accept

# ─── 6. 2FA HANDLING ──────────────────────────────────────────
# When 2FA prompt appears on phone, user approves it.
# IBC waits up to 180 seconds for the mobile approval.
ExistingSessionDetectedAction=primary
SecondFactorDevice=

# ─── 7. UI SUPPRESSION (silent operation) ─────────────────────
MinimizeMainWindow=yes
AllowBlindTrading=yes
DismissPasswordExpiryWarning=yes
DismissNSEComplianceNotice=yes
SuppressInfoMessages=yes

# ─── 8. LOGGING ───────────────────────────────────────────────
LogToConsole=yes
LogComponents=never

# ─── 9. MISC ──────────────────────────────────────────────────
SendMarketDataInLotsForUSstocks=no
Store2faSettingsAt=
